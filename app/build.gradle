plugins {
    id 'com.android.application'
}

android {
    namespace 'com.aldef.power'
    compileSdk 35

    defaultConfig {
        applicationId 'com.aldef.power'
        minSdk 26
        targetSdk 35
        versionCode 5
        versionName '1.5'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Ditandatangani dengan debug key supaya APK release bisa langsung di-install.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
